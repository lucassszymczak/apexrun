# Publica o app (build do Vite) no GitHub Pages.
# Requer, uma vez, no repositório:
#   1. Settings > Pages > Build and deployment > Source = "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > New repository secret:
#        VITE_SUPABASE_URL       (a Project URL do Supabase)
#        VITE_SUPABASE_ANON_KEY  (a chave pública / publishable)
# A chave pública pode ficar no bundle do site (é pública por design; o RLS
# protege os dados). NUNCA coloque a service_role/secret aqui.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/apex-performance-ingestion-2cafan]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; cancela builds antigos em andamento.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /apexrun/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # SPA: reaproveita index.html como 404 para recarregar em qualquer rota.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
