<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Apex Performance</title>
    <meta name="description" content="Apex Performance — treinos, análises e ciclo de prova." />
    <meta name="theme-color" content="#0D0F1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Apex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./apex-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apex-icon-180.png" />
    <script>
      // Tema antes da primeira pintura (mesma chave do app antigo: apex.theme).
      // "dark" | "light" | "auto" (segue o sistema). Padrão: escuro.
      (function () {
        var t = null;
        try { t = localStorage.getItem('apex.theme'); } catch (e) {}
        if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O Apex Performance precisa de JavaScript ligado.</noscript>
    <script type="module" src="./app/main.tsx"></script>
  </body>
</html>
