<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Compartilhar · celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0d0f1a}
a{color:#22d3ee;text-decoration:none}a:hover{color:#a5f3fc}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0d0f1a; color: #f2f2f7; font-family: Outfit, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 4px">
    <a href="Treino.dc.html" aria-label="Voltar ao treino" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #f2f2f7">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l14 0"/><path d="M5 12l6 6"/><path d="M5 12l6 -6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 20px; line-height: 24px; font-weight: 500">Compartilhar</h1>
      <span style="font-size: 13px; line-height: 16px; color: #a3a9b8">Meia de Floripa · 29 ago</span>
    </div>
  </header>

  <div style="height: 400px; display: flex; align-items: center; justify-content: center; padding: 8px 0">
    <div role="img" aria-label="Prévia do card no formato {{formatoNome}}, modelo {{modeloNome}}" style="position: relative; width: {{previewW}}px; height: {{previewH}}px; border-radius: 16px; overflow: hidden; background: #0d0f1a; border: 1px solid #2a3042">

      <sc-if value="{{isFoto}}" hint-placeholder-val="{{ true }}">
        <svg width="100%" height="100%" viewBox="0 0 90 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0">
          <rect width="90" height="160" fill="#e9955a"/><rect width="90" height="44" fill="#d97b4a"/><circle cx="58" cy="64" r="12" fill="#ffd98a"/><rect y="76" width="90" height="84" fill="#1c4f70"/><path d="M8 88 H40 M30 96 H80 M12 106 H60 M44 116 H86" stroke="#4f8db3" stroke-width="1"/><rect y="118" width="90" height="42" fill="#0d0f1a" opacity="0.6"/>
        </svg>
        <svg width="100%" height="72%" viewBox="60 90 300 300" aria-hidden="true" style="position: absolute; left: 0; top: 6%">
          <path d="M107.6 341 L136 335.6 L160.3 308.6 L188.6 297.8 L212.9 265.4 L241.3 249.2 L265.6 211.4 L293.9 189.8 L318.2 152 L331.7 119.6 L312.8 108.8 L287.2 135.8 L260.2 168.2 L229.1 189.8 L200.8 216.8 L172.4 238.4 L145.4 265.4 L117.1 287 L92.8 319.4" fill="none" stroke="#ffffff" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M107.6 341 L136 335.6 L160.3 308.6 L188.6 297.8 L212.9 265.4 L241.3 249.2 L265.6 211.4 L293.9 189.8 L318.2 152 L331.7 119.6 L312.8 108.8 L287.2 135.8 L260.2 168.2 L229.1 189.8 L200.8 216.8 L172.4 238.4 L145.4 265.4 L117.1 287 L92.8 319.4" fill="none" stroke="#e8459a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M79.3 362.6 L107.6 341 M92.8 319.4 L79.3 362.6" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" style="opacity: {{fimOpacity}}"/>
          <circle cx="86" cy="345" r="44" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" style="opacity: {{zonaOpacity}}"/>
        </svg>
      </sc-if>

      <sc-if value="{{isMapa}}" hint-placeholder-val="{{ false }}">
        <svg width="100%" height="76%" viewBox="40 80 330 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; left: 0; top: 0">
          <rect x="0" y="0" width="390" height="440" fill="#0d0f1a"/>
          <path d="M0 0 L260 0 C205 60 110 140 0 210 Z" fill="#0f2233"/>
          <path d="M0 410 L390 220 M70 0 L230 440 M270 0 L370 440 M0 300 L390 90" stroke="#1a1f2c" stroke-width="7" fill="none"/>
          <path d="M107.6 341 L136 335.6 L160.3 308.6 L188.6 297.8 L212.9 265.4 L241.3 249.2" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M241.3 249.2 L265.6 211.4 L293.9 189.8 L318.2 152 L331.7 119.6 L312.8 108.8 L287.2 135.8 L260.2 168.2" fill="none" stroke="#8b7cf6" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M260.2 168.2 L229.1 189.8 L200.8 216.8 L172.4 238.4 L145.4 265.4 L117.1 287 L92.8 319.4" fill="none" stroke="#e0337f" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M79.3 362.6 L107.6 341 M92.8 319.4 L79.3 362.6" fill="none" stroke="#80879a" stroke-width="5" stroke-linecap="round" style="opacity: {{fimOpacity}}"/>
          <circle cx="86" cy="345" r="40" fill="rgba(13, 15, 26, 0.5)" stroke="#a3a9b8" stroke-width="2" stroke-dasharray="6 6" style="opacity: {{zonaOpacity}}"/>
          <g font-family="Outfit, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#f2f2f7">
            <circle cx="212.9" cy="265.4" r="10" fill="#0d0f1a" stroke="#f2f2f7" stroke-width="1.5"/><text x="212.9" y="269.2">5</text>
            <circle cx="331.7" cy="119.6" r="10" fill="#0d0f1a" stroke="#f2f2f7" stroke-width="1.5"/><text x="331.7" y="123.4">10</text>
            <circle cx="200.8" cy="216.8" r="10" fill="#0d0f1a" stroke="#f2f2f7" stroke-width="1.5"/><text x="200.8" y="220.6">15</text>
          </g>
        </svg>
      </sc-if>

      <sc-if value="{{isNumeros}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 20px; background: #0d0f1a">
          <svg width="56" height="50" viewBox="0 0 100 90" aria-hidden="true"><polygon points="6,86 50,4 59,20.77 24,86" fill="#e8459a"/><polygon points="94,86 50,4 41,20.77 76,86" fill="#22d3ee"/><polygon points="50,4 59,20.77 50,37.55 41,20.77" fill="#5b3fd0"/></svg>
          <div style="display: flex; flex-direction: column; gap: 10px; font-variant-numeric: tabular-nums">
            <div><span style="display: block; font-size: 40px; line-height: 42px; font-weight: 500">21,20 km</span><span style="font-size: 13px; color: #a3a9b8">Meia de Floripa</span></div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
              <div><span style="display: block; font-size: 24px; line-height: 28px; font-weight: 500; color: #e8459a">7:39</span><span style="font-size: 11px; color: #a3a9b8">/km</span></div>
              <div><span style="display: block; font-size: 24px; line-height: 28px; font-weight: 500">2h42</span><span style="font-size: 11px; color: #a3a9b8">tempo</span></div>
              <div><span style="display: block; font-size: 24px; line-height: 28px; font-weight: 500">167</span><span style="font-size: 11px; color: #a3a9b8">bpm</span></div>
              <div><span style="display: block; font-size: 24px; line-height: 28px; font-weight: 500; color: #34d399">+2,6%</span><span style="font-size: 11px; color: #a3a9b8">deriva</span></div>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{showOverlay}}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 6px; color: #ffffff; font-size: 11px; font-weight: 500">
          <svg width="18" height="16" viewBox="0 0 100 90" aria-hidden="true"><path fill="#ffffff" fill-rule="evenodd" d="M6 86 L50 4 L94 86 L76 86 L50 37.55 L24 86 Z"/></svg>
          Apex Performance
        </div>
        <div style="position: absolute; left: 14px; right: 14px; bottom: 14px; color: #ffffff; font-variant-numeric: tabular-nums">
          <span style="display: block; font-size: 11px; line-height: 14px; opacity: 0.9">Meia de Floripa</span>
          <span style="display: block; font-size: 30px; line-height: 34px; font-weight: 500">21,20 km</span>
          <span style="display: block; font-size: 13px; line-height: 18px">2h42 · 7:39/km · 167 bpm</span>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 0; flex-grow: 1">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; line-height: 18px; color: #a3a9b8">Formato</span>
      <div role="group" aria-label="Formato" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #161a26; border: 1px solid #2a3042; border-radius: 999px; padding: 3px">
        <sc-for list="{{formatos}}" as="f" hint-placeholder-count="2">
          <button onClick="{{f.pick}}" style="border: none; border-radius: 999px; padding: 8px 0; font-family: Outfit, system-ui, sans-serif; font-size: 13px; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; line-height: 18px; color: #a3a9b8">Modelo</span>
      <div role="group" aria-label="Modelo" style="display: flex; gap: 8px">
        <sc-for list="{{modelos}}" as="m" hint-placeholder-count="3">
          <button onClick="{{m.pick}}" style="flex: 1; border: 1px solid {{m.border}}; border-radius: 8px; padding: 9px 0; font-family: Outfit, system-ui, sans-serif; font-size: 13px; background: #161a26; color: {{m.fg}}">{{m.label}}</button>
        </sc-for>
      </div>
    </div>
    <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #161a26; border-radius: 12px; padding: 10px 14px">
      <span style="display: flex; flex-direction: column">
        <span style="font-size: 15px; line-height: 20px">Ocultar início e fim</span>
        <span style="font-size: 11px; line-height: 14px; color: #a3a9b8">Raio de 500 m, para não mostrar onde você mora</span>
      </span>
      <input type="checkbox" role="switch" checked="{{ocultar}}" onChange="{{toggleOcultar}}" style="width: 44px; height: 24px; accent-color: #22d3ee">
    </label>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; padding: 16px">
    <button style="height: 48px; border: none; border-radius: 12px; background: #e8459a; color: #0d0f1a; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: Outfit, system-ui, sans-serif; font-size: 16px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.7 10.7l6.6 -3.4"/><path d="M8.7 13.3l6.6 3.4"/></svg>
      Compartilhar imagem
    </button>
    <button style="height: 48px; border: 1px solid #2a3042; border-radius: 12px; background: transparent; color: #f2f2f7; font-family: Outfit, system-ui, sans-serif; font-size: 15px">Salvar</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { formato: 'stories', modelo: 'foto', ocultar: true };
  }
  renderVals() {
    const s = this.state;
    const formatos = [['stories', 'Stories 9:16'], ['feed', 'Feed 4:5']].map(([id, label]) => ({
      label,
      bg: s.formato === id ? '#22d3ee' : 'transparent',
      fg: s.formato === id ? '#0d0f1a' : '#f2f2f7',
      pick: () => this.setState({ formato: id })
    }));
    const modelos = [['foto', 'Foto'], ['mapa', 'Mapa'], ['numeros', 'Só números']].map(([id, label]) => ({
      label,
      border: s.modelo === id ? '#22d3ee' : '#2a3042',
      fg: s.modelo === id ? '#22d3ee' : '#f2f2f7',
      pick: () => this.setState({ modelo: id })
    }));
    const stories = s.formato === 'stories';
    return {
      formatos, modelos,
      previewW: stories ? 214 : 300,
      previewH: stories ? 380 : 375,
      formatoNome: stories ? 'Stories' : 'Feed',
      modeloNome: s.modelo === 'foto' ? 'Foto' : s.modelo === 'mapa' ? 'Mapa' : 'Só números',
      isFoto: s.modelo === 'foto',
      isMapa: s.modelo === 'mapa',
      isNumeros: s.modelo === 'numeros',
      showOverlay: s.modelo !== 'numeros',
      ocultar: s.ocultar,
      fimOpacity: s.ocultar ? 0 : 1,
      zonaOpacity: s.ocultar ? 1 : 0,
      toggleOcultar: () => this.setState({ ocultar: !this.state.ocultar })
    };
  }
}
</script>
</body>
</html>
