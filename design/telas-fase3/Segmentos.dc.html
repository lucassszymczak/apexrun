<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Segmentos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0d0f1a}
a{color:#22d3ee;text-decoration:none}a:hover{color:#a5f3fc}
</style>
</helmet>
<div style="width: 390px; height: 1000px; overflow: hidden; box-sizing: border-box; background: #0d0f1a; color: #f2f2f7; font-family: Outfit, system-ui, sans-serif; font-variant-numeric: tabular-nums; padding: 56px 16px 34px; display: flex; flex-direction: column; gap: 16px">

  <header style="display: flex; align-items: center; gap: 4px">
    <a href="#" aria-label="Voltar para Progresso" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #f2f2f7">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l14 0"/><path d="M5 12l6 6"/><path d="M5 12l6 -6"/></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 500">Segmentos</h1>
      <span style="font-size: 13px; line-height: 18px; color: #a3a9b8">Trechos que você repete, encontrados pelo app</span>
    </div>
  </header>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <div role="tablist" aria-label="Modalidade" style="display: flex; background: #161a26; border: 1px solid #2a3042; border-radius: 999px; padding: 3px">
      <sc-for list="{{abas}}" as="a" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{a.on}}" onClick="{{a.pick}}" style="min-height: 38px; border: none; border-radius: 999px; padding: 0 16px; background: {{a.bg}}; color: {{a.fg}}; font-family: Outfit, system-ui, sans-serif; font-size: 14px">{{a.label}}</button>
      </sc-for>
    </div>
    <button aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px; background: transparent; border: 1px solid #2a3042; border-radius: 8px; color: #f2f2f7; font-family: Outfit, system-ui, sans-serif; font-size: 13px">Mais passagens
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg>
    </button>
  </div>

  <sc-if value="{{isBike}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; gap: 8px; align-items: flex-start; background: #161a26; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 18px; color: #a3a9b8">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M11 12h1v4h1"/></svg>
      <span>No pedal, a comparação é só pelo tempo real. O ajuste por inclinação e clima vale só para corrida.</span>
    </div>
  </sc-if>

  <div role="tabpanel" style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{lista}}" as="s" hint-placeholder-count="5">
      <a href="SegmentoDetalhe.dc.html" style="display: flex; gap: 12px; align-items: center; background: #161a26; border-radius: 14px; padding: 12px; color: #f2f2f7">
        <svg width="56" height="44" viewBox="0 0 56 44" aria-hidden="true" style="flex-shrink: 0; background: #1f2433; border-radius: 8px">
          <polyline points="{{s.forma}}" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <span style="font-size: 15px; line-height: 20px; font-weight: 500">{{s.nome}}</span>
          <span style="font-size: 12px; line-height: 16px; color: #a3a9b8">{{s.info}}</span>
          <span style="font-size: 13px; line-height: 18px">Melhor {{s.melhor}} <span style="color: #a3a9b8">{{s.ajustado}}</span></span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; max-width: 92px; text-align: right; font-size: 12px; line-height: 16px; color: {{s.tCor}}">
          <span style="font-size: 16px; line-height: 18px">{{s.tIcone}}</span>{{s.tend}}
        </span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mod: 'run' };
    this.run = [
      { nome: 'Subida perto de casa', info: '1,2 km · +18 m · 14 passagens', melhor: '6:52', ajustado: '· ajustado 6:40', tend: '18 s mais rápido desde ago', t: 'melhor', forma: '8,36 18,30 26,26 34,18 42,12 48,8' },
      { nome: 'Segmento 2', info: '0,8 km · plano · 22 passagens', melhor: '4:58', ajustado: '· ajustado 4:55', tend: 'estável', t: 'igual', forma: '6,22 18,20 30,23 42,21 50,22' },
      { nome: 'Segmento 7', info: '2,0 km · −8 m · 9 passagens', melhor: '12:40', ajustado: '· ajustado 12:31', tend: 'estável', t: 'igual', forma: '8,10 14,18 20,26 30,30 40,32 48,36' },
      { nome: 'Segmento 1', info: '1,5 km · +12 m · 6 passagens', melhor: '9:31', ajustado: '· ajustado 9:20', tend: '5 s mais lento desde set', t: 'pior', forma: '8,34 16,30 22,22 32,20 40,14 48,12' },
      { nome: 'Segmento 9', info: '0,6 km · +19 m · 4 passagens', melhor: '4:21', ajustado: '· ajustado 3:58', tend: 'poucas passagens', t: 'neutro', forma: '28,38 28,28 30,18 28,8' }
    ];
    this.bike = [
      { nome: 'Segmento P2', info: '5,4 km · +60 m · 11 passagens', melhor: '12:05', ajustado: '· tempo real', tend: '25 s mais rápido desde jul', t: 'melhor', forma: '6,34 16,28 24,26 34,18 44,16 50,8' },
      { nome: 'Segmento P1', info: '3,1 km · plano · 8 passagens', melhor: '6:10', ajustado: '· tempo real', tend: 'estável', t: 'igual', forma: '6,14 18,16 30,14 42,18 50,16' },
      { nome: 'Segmento P5', info: '8,2 km · +49 m · 5 passagens', melhor: '17:44', ajustado: '· tempo real', tend: 'poucas passagens', t: 'neutro', forma: '8,8 12,20 20,28 32,32 44,30 50,36' }
    ];
  }
  renderVals() {
    const s = this.state;
    const tend = {
      melhor: ['↓', '#34d399'], igual: ['=', '#a3a9b8'], pior: ['↑', '#fbbf24'], neutro: ['·', '#a3a9b8']
    };
    const abas = [['run', 'Corrida'], ['bike', 'Pedal']].map(([id, label]) => ({
      label, on: s.mod === id ? 'true' : 'false',
      bg: s.mod === id ? '#22d3ee' : 'transparent',
      fg: s.mod === id ? '#0d0f1a' : '#f2f2f7',
      pick: () => this.setState({ mod: id })
    }));
    const lista = (s.mod === 'run' ? this.run : this.bike).map((x) => Object.assign({}, x, { tIcone: tend[x.t][0], tCor: tend[x.t][1] }));
    return { abas, lista, isBike: s.mod === 'bike' };
  }
}
</script>
</body>
</html>
