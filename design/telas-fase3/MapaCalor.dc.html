<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mod: 'run', fundo: true };
  }
  renderVals() {
    const s = this.state;
    const run = s.mod === 'run';
    const mods = [['run', 'Corrida'], ['bike', 'Pedal']].map(([id, label]) => ({
      label, on: s.mod === id ? 'true' : 'false',
      bg: s.mod === id ? '#22d3ee' : 'transparent',
      fg: s.mod === id ? '#0d0f1a' : '#f2f2f7',
      pick: () => this.setState({ mod: id })
    }));
    return {
      mods,
      modNome: run ? 'corrida' : 'pedal',
      showRun: run ? 'inline' : 'none',
      showBike: run ? 'none' : 'inline',
      isRun: run, isBike: !run,
      baseOpacity: s.fundo ? 1 : 0,
      fundoOn: s.fundo ? 'true' : 'false',
      fundoBorda: s.fundo ? '#22d3ee' : '#2a3042',
      fundoCor: s.fundo ? '#22d3ee' : '#f2f2f7',
      toggleFundo: () => this.setState({ fundo: !this.state.fundo }),
      resumo: run ? '86 corridas · 142 km de ruas diferentes' : '31 pedais · 388 km de ruas diferentes',
      resumoSub: run ? 'Últimos 12 meses' : 'Últimos 12 meses · separado da corrida',
      semTrajeto: run ? '4 corridas sem trajeto ficaram de fora · Buscar trajetos antigos' : '2 pedais sem trajeto ficaram de fora · Buscar trajetos antigos'
    };
  }
}
</script>
